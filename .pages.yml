media:
  input: public/images/uploads
  output: /images/uploads

content:
  - name: writing
    label: Writing
    type: collection
    path: src/content/writing
    filename: '{fields.slug}.md'
    view:
      fields: [title, date, draft, featured]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - {
          name: slug,
          label: Slug,
          type: string,
          required: true,
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$',
        }
      - { name: description, label: Description, type: text, required: true }
      - { name: date, label: Publish date, type: date, required: true }
      - { name: updated, label: Updated date, type: date }
      - { name: cover, label: Cover image, type: image, required: true }
      - { name: coverAlt, label: Cover alt text, type: string, required: true }
      - { name: tags, label: Tags, type: string, list: true, required: true }
      - { name: featured, label: Featured, type: boolean, default: false }
      - { name: draft, label: Draft, type: boolean, default: true }
      - { name: body, label: Content, type: rich-text, required: true }

  - name: notes
    label: Notes
    type: collection
    path: src/content/notes
    filename: '{fields.slug}.md'
    view:
      fields: [title, date, draft]
      primary: title
      sort: [date]
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - {
          name: slug,
          label: Slug,
          type: string,
          required: true,
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$',
        }
      - { name: date, label: Date, type: date, required: true }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: draft, label: Draft, type: boolean, default: true }
      - { name: body, label: Note, type: rich-text, required: true }

  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    filename: '{fields.slug}.md'
    view:
      fields: [name, year, featured, draft]
      primary: name
      sort: [year, name]
    fields:
      - { name: name, label: Name, type: string, required: true }
      - {
          name: slug,
          label: Slug,
          type: string,
          required: true,
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$',
        }
      - { name: description, label: Description, type: text, required: true }
      - { name: year, label: Year, type: number, required: true }
      - { name: cover, label: Cover image, type: image, required: true }
      - { name: coverAlt, label: Cover alt text, type: string, required: true }
      - { name: tech, label: Tech stack, type: string, list: true, required: true }
      - { name: github, label: GitHub URL, type: string }
      - { name: demo, label: Demo URL, type: string }
      - { name: featured, label: Featured, type: boolean, default: false }
      - { name: draft, label: Draft, type: boolean, default: false }
      - { name: body, label: Project story, type: rich-text, required: true }

  - name: now
    label: Now
    type: file
    path: src/data/now.json
    fields:
      - { name: updated, label: Updated date, type: date, required: true }
      - { name: intro, label: Introduction, type: text, required: true }
      - { name: reading, label: Reading, type: string, list: true }
      - { name: building, label: Building, type: string, list: true }
      - { name: learning, label: Learning, type: string, list: true }
      - { name: listening, label: Listening, type: string, list: true }
      - { name: thinking, label: Thinking, type: string, list: true }

  - name: uses
    label: Uses
    type: file
    path: src/data/uses.json
    fields:
      - { name: intro, label: Introduction, type: text }
      - name: sections
        label: Sections
        type: object
        list: true
        fields:
          - { name: title, label: Section title, type: string }
          - name: items
            label: Items
            type: object
            list: true
            fields:
              - { name: name, label: Name, type: string }
              - { name: detail, label: Detail, type: text }

  - name: settings
    label: Site settings
    type: file
    path: src/data/site.json
    fields:
      - { name: name, label: Site name, type: string, required: true }
      - { name: author, label: Author, type: string, required: true }
      - { name: title, label: Default title, type: string, required: true }
      - { name: description, label: Description, type: text, required: true }
      - { name: tagline, label: Tagline, type: string }
      - { name: heroText, label: Hero text, type: text }
      - { name: heroSubtitle, label: Hero subtitle, type: text }
      - { name: url, label: Site URL, type: string, required: true }
      - { name: email, label: Email, type: string }
      - { name: github, label: GitHub URL, type: string }
      - name: social
        label: Social links
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: url, label: URL, type: string }
      - { name: footer, label: Footer line, type: string }
      - name: navigation
        label: Navigation
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: href, label: Path, type: string }
